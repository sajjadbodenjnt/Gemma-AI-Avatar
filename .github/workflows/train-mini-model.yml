name: Train Bengali Mini Model
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs (start with 1)"
        required: true
        default: "1"
  push:
    paths:
      - "training/**"
      - ".github/workflows/train-mini-model.yml"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/requirements.txt
      - name: Fine-tune Bengali LoRA adapter
        env:
          EPOCHS: ${{ inputs.epochs || '1' }}
        run: python training/train_lora.py
      - name: Upload adapter artifact
        uses: actions/upload-artifact@v4
        with:
          name: aibondhu-lora-adapter
          path: output/aibondhu-lora/
          if-no-files-found: error
          retention-days: 14
