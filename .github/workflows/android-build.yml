name: AIBondhu Model + Avatar APK

on:
  workflow_run:
    workflows: ["Export AIBondhu GGUF"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Download trained Bengali GGUF model
        uses: actions/download-artifact@v4
        with:
          name: aibondhu-android-gguf-q4km
          path: android/app/src/main/assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify model asset
        run: |
          test -s android/app/src/main/assets/aibondhu-q4_k_m.gguf
          ls -lh android/app/src/main/assets/aibondhu-q4_k_m.gguf
      - name: Prepare offline photorealistic Sophia avatar
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz --output /tmp/blender.tar.xz
          tar -xJf /tmp/blender.tar.xz -C /tmp
          BLENDER=/tmp/blender-4.2.3-linux-x64/blender
          mkdir -p android/app/src/main/assets
          curl --fail --location --retry 3 https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/renderpeople_sophia.fbx --output /tmp/renderpeople_sophia.fbx
          curl --fail --location --retry 3 https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/rigs/renderpeople_sophia.png --output /tmp/renderpeople_sophia.png
          "$BLENDER" --background --python android/tools/export_avatar.py -- --input /tmp/renderpeople_sophia.fbx --texture /tmp/renderpeople_sophia.png --output "$GITHUB_WORKSPACE/android/app/src/main/assets/sophia.glb"
          test -s android/app/src/main/assets/sophia.glb
          curl --fail --location --retry 3 https://raw.githubusercontent.com/s0ck3t/VideoIntoBlenderModel/main/assets/LICENCES.md --output android/app/src/main/assets/AVATAR_SOURCE_LICENSES.md
          npm install --prefix android/app/src/main --no-save --no-audit --no-fund three@0.170.0 esbuild@0.24.2
          android/app/src/main/node_modules/.bin/esbuild android/app/src/main/avatar-src.js --bundle --format=iife --target=es2020 --outfile=android/app/src/main/assets/avatar.bundle.js
          test -s android/app/src/main/assets/avatar.bundle.js
          ls -lh android/app/src/main/assets/sophia.glb android/app/src/main/assets/avatar.bundle.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;27.2.12479018"
      - name: Build model-included ARM64 APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Verify APK contains model and avatar
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/aibondhu-q4_k_m.gguf|assets/sophia.glb|assets/avatar.bundle.js'
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: AIBondhu-Offline-3D-Voice-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
